# Parallel discovery requires MPI-configured MFEM headers.
# generate_nsb_artifacts(serial=False) supplies mpi4py/Hypre discovery includes.
bridge_id = "pymfem-par"
source_root = "../.."
output_dir = "nsb_artifacts"
registration_module = "mfem._par._nsb_registration"
director_helper_module = "mfem._par.nsb_director_bindings"
mpi_module = "mfem._par._nsb_mpi"
state_backend = "mfem_par"
state_module = "mfem._par.nsb_state_bindings"

[[interfaces]]
interface = "mfem/_par/blockoperator.i"
python_module = "mfem._par.blockoperator"
include_dirs = ["mfem/_par", "mfem/common", "external/mfem/cmbuild_par", "external/mfem"]
swig_options = ["-python", "-DMFEM_NUMBA_SWIG_BRIDGE_PAR"]

[[interfaces]]
interface = "mfem/_par/matrix.i"
python_module = "mfem._par.matrix"
