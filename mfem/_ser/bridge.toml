bridge_id = "pymfem-ser"
source_root = "../.."
output_dir = "nsb_artifacts"
registration_module = "mfem._ser._nsb_registration"
director_helper_module = "mfem._ser.nsb_director_bindings"
state_backend = "mfem"
state_module = "mfem._nsb_state_bindings"

