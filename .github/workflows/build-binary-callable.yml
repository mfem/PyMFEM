name: Build Linux binary release

on:
  workflow_call:
    inputs:
      publish:
        description: Publish after all wheel pairs and the sdist pass validation.
        type: boolean
        default: false
      candidate-version:
        description: Optional shared candidate version for this build.
        type: string
        default: ''
      repository-url:
        description: PyPI or TestPyPI upload endpoint.
        type: string
        required: true
    secrets:
      upload-token:
        required: false

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set candidate version
        id: version
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate-version }}
        run: |
          pip install build packaging
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version
          path = Path('mfem/__init__.py')
          if os.environ['CANDIDATE_VERSION']:
              version = str(Version(os.environ['CANDIDATE_VERSION']))
              text, count = re.subn(r'^__version__ = .*$', '__version__ = ' + repr(version),
                                    path.read_text(), flags=re.MULTILINE)
              assert count == 1
              path.write_text(text)
          import mfem
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + mfem.__version__ + '\n')
          PY
      - name: Build base source distribution
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        pythonpath: [cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    env:
      RELEASE_VERSION: ${{ needs.sdist.outputs.version }}
      PYMFEM_BUILD_NCPU: '2'
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and MPICH
        run: |
          set -euo pipefail
          echo "/opt/python/${{ matrix.pythonpath }}/bin" >> "$GITHUB_PATH"
          export PATH=/opt/python/${{ matrix.pythonpath }}/bin:$PATH
          dnf install -y zlib-devel
          pip install --only-binary=:all: --upgrade pip wheel packaging auditwheel patchelf twine swig 'mpich==5.0.2' 'mpi4py==4.1.2'

      - name: Use the source distribution version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('mfem/__init__.py')
          text, count = re.subn(r'^__version__ = .*$', '__version__ = ' + repr(os.environ['RELEASE_VERSION']),
                                path.read_text(), flags=re.MULTILINE)
          assert count == 1
          path.write_text(text)
          PY

      - name: Build and validate the serial wheel
        run: bash _build_system/distribution/build_serial_wheel.sh "$RUNNER_TEMP/serial-build"

      - name: Build and validate the MPICH wheel pair
        run: bash _build_system/distribution/build_mpich_wheel.sh "$RUNNER_TEMP/mpich-build" "$RUNNER_TEMP"/serial-build/mfem-*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: linux-pair-${{ matrix.pythonpath }}
          path: |
            ${{ runner.temp }}/serial-build/*.whl
            ${{ runner.temp }}/mpich-build/*.whl
          if-no-files-found: error

      - name: Save build and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-logs-${{ matrix.pythonpath }}
          path: |
            ${{ runner.temp }}/serial-build/build.log
            ${{ runner.temp }}/mpich-build/build.log
            ${{ runner.temp }}/mpich-build/mpi-libraries.txt
            ${{ runner.temp }}/mpich-build/validation/*.json
          if-no-files-found: ignore

  release-check:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-pair-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-sdist
          path: dist

      - name: Check complete matching release coverage
        run: |
          pip install packaging twine
          python _build_system/distribution/check_release.py dist
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: release-check
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: dist

      - name: Upload the validated release
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.upload-token }}
          TWINE_REPOSITORY_URL: ${{ inputs.repository-url }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          pip install twine
          twine upload dist/*
