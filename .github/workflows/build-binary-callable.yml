name: Build Linux binary release

on:
  workflow_call:
    inputs:
      repository-url:
        description: PyPI or TestPyPI upload endpoint.
        type: string
        required: true
    secrets:
      upload-token:
        required: true

permissions:
  contents: read

jobs:
  make_sdist:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: build_sdist
        env:
          TWINE_REPOSITORY_URL: ${{ inputs.repository-url }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.upload-token }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          git clone https://github.com/mfem/PyMFEM.git
          cd PyMFEM
          REF=$(echo ${GITHUB_REF#refs/heads/})
          echo "!!!!!: "$REF
          git checkout $REF
          export PATH=/opt/python/cp311-cp311/bin:$PATH

          pip install setuptools
          pip install -U packaging
          pip3 install wheel six auditwheel twine
          pip3 install "urllib3==1.26.6"    # use older version to avoid OpenSSL vesion issue

          rm -rf dist/*
          python3 setup.py sdist
          ls -l dist/
          python3 -m twine upload --verbose dist/*
  make_binary_3_11_12_13_14:
    needs: make_sdist
    strategy:
      matrix:
        pythonpath: ["cp311-cp311", "cp312-cp312", "cp313-cp313", "cp314-cp314"]

    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - name: build package
        env:
          TWINE_REPOSITORY_URL: ${{ inputs.repository-url }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.upload-token }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          set -euo pipefail
          echo It runs in the container instead of the VM.
          git clone https://github.com/mfem/PyMFEM.git
          cd PyMFEM
          REF=$(echo ${GITHUB_REF#refs/heads/})
          echo "!!!!!!: "$REF
          git checkout $REF
          ls -l /opt/python/
          export PATH=/opt/python/${{ matrix.pythonpath }}/bin:$PATH

          dnf install -y zlib-devel
          pip3 install --upgrade pip setuptools packaging
          pip3 install wheel auditwheel twine
          pip3 install "urllib3==1.26.6"    # use older version to avoid OpenSSL vesion issue

          # Test packaging tools
          python3 -m unittest discover -s _build_system/tests

          # Build the wheel for the current Python version
          python3 -m pip wheel . --verbose --no-deps --wheel-dir raw-wheels

          # Select the appropriate wheel payload, run auditwheel, and repackage wheel
          python3 _build_system/select_wheel_payload.py raw-wheels/*.whl --profile serial --output-dir selected-wheels
          auditwheel repair selected-wheels/*.whl --plat manylinux_2_28_x86_64 --wheel-dir dist
          python3 _build_system/select_wheel_payload.py dist/*.whl --profile serial --check

          # Check the repaired wheel for compliance with the selected profile
          python3 -m twine check dist/*.whl

          # Test the final release artifact in a fresh environment outside the checkout.
          source_dir=$PWD
          smoke_dir=$(mktemp -d)
          python3 -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --only-binary=:all: "$source_dir"/dist/*.whl
          "$smoke_dir/venv/bin/python" -m pip check
          cp examples/ex1.py data/star.mesh "$smoke_dir/"
          cd "$smoke_dir"
          unset PYTHONPATH LD_LIBRARY_PATH
          "$smoke_dir/venv/bin/python" -I "$source_dir/_build_system/check_serial_install.py" ex1.py star.mesh
          cd "$source_dir"

          ls -l dist/
          python3 -m twine upload --verbose dist/*
