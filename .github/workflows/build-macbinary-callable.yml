name: Build macOS ARM wheel pairs

on:
  workflow_call:
    inputs:
      publish:
        description: Publish only after every wheel pair has passed validation.
        type: boolean
        default: false
      candidate-version:
        description: Optional shared candidate version for this build.
        type: string
        default: ''
      repository-url:
        description: PyPI or TestPyPI upload endpoint.
        type: string
        required: true
    secrets:
      upload-token:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CC: clang
      CXX: clang++
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Check build architecture
        run: test "$(uname -m)" = arm64
      - name: Install tools and pip MPICH
        run: pip install --upgrade pip wheel packaging 'delocate==0.13.0' twine swig 'mpich==5.0.2' 'mpi4py==4.1.2'
      - name: Set candidate version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          from packaging.version import Version
          if os.environ['CANDIDATE_VERSION']:
              path = Path('mfem/__init__.py')
              version = str(Version(os.environ['CANDIDATE_VERSION']))
              text, count = re.subn(r'^__version__ = .*$', '__version__ = ' + repr(version),
                                    path.read_text(), flags=re.MULTILINE)
              assert count == 1
              path.write_text(text)
          PY
      - name: Build and validate the serial wheel
        run: bash _build_system/distribution/build_serial_wheel.sh --work-dir "$RUNNER_TEMP/serial-build"
      - name: Build and validate the MPICH plus GSLIB wheel pair
        run: bash _build_system/distribution/build_mpich_wheel.sh --base-wheel "$RUNNER_TEMP"/serial-build/mfem-*.whl --work-dir "$RUNNER_TEMP/mpich-build"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-pair-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/serial-build/*.whl
            ${{ runner.temp }}/mpich-build/*.whl
          if-no-files-found: error
      - name: Save build and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-logs-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/serial-build/build.log
            ${{ runner.temp }}/mpich-build/build.log
            ${{ runner.temp }}/mpich-build/mpi-libraries.txt
            ${{ runner.temp }}/mpich-build/validation/*.json
          if-no-files-found: ignore

  release-check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-arm64-pair-py*
          merge-multiple: true
          path: dist
      - name: Check matching macOS wheel coverage
        run: |
          pip install packaging twine
          python _build_system/distribution/check_release.py dist --platform macosx_14_0_arm64
          twine check dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: release-check
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: dist
      - name: Upload validated wheel pairs
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.upload-token }}
          TWINE_REPOSITORY_URL: ${{ inputs.repository-url }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          pip install twine
          twine upload dist/*.whl

  downloaded-pair:
    needs: publish
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
      REPOSITORY_URL: ${{ inputs.repository-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - name: Download exact candidates and validate the public extra
        run: |
          set -euo pipefail
          pip install --upgrade pip wheel 'delocate==0.13.0'
          version=${CANDIDATE_VERSION:-$(python -c 'import mfem; print(mfem.__version__)')}
          index=https://pypi.org/simple/
          if [[ "$REPOSITORY_URL" == *test.pypi.org* ]]; then
            index=https://test.pypi.org/simple/
          fi
          pip download --index-url "$index" --no-deps --only-binary=:all: --dest downloaded "mfem==$version" "mfem-mpich==$version"
          python _build_system/distribution/validate_mpich_pair.py downloaded/mfem-*.whl downloaded/mfem_mpich-*.whl --work-dir "$RUNNER_TEMP/downloaded-validation" --examples-dir examples --mesh data/star.mesh 2>&1 | tee downloaded-validation.log
      - name: Save downloaded-pair validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-downloaded-logs-py${{ matrix.python-version }}
          path: downloaded-validation.log
          if-no-files-found: ignore
