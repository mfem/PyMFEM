name: Build and test NSB (dispatch)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nsb:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') }}
    strategy:
      fail-fast: false
      matrix:
        backend: [serial, openmpi, mpich]
    name: NSB | ${{ matrix.backend }} | Python 3.13
    uses: ./.github/workflows/Build-and-test-NSB-callable.yml
    with:
      backend: ${{ matrix.backend }}

