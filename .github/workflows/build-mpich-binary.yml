name: Validate Linux MPICH wheel pair

on:
  workflow_dispatch:
    inputs:
      candidate-version:
        description: Optional shared candidate version; required for TestPyPI upload.
        type: string
        default: ''
      publish-testpypi:
        description: Upload validated release to TestPyPI and validate downloaded wheels.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - name: Check publication settings
        env:
          PUBLISH: ${{ inputs.publish-testpypi }}
          VERSION: ${{ inputs.candidate-version }}
        run: |
          if [[ "$PUBLISH" == true && -z "$VERSION" ]]; then
            echo 'Set a fresh candidate-version for TestPyPI publication' >&2
            exit 1
          fi

  linux-release:
    needs: settings
    uses: ./.github/workflows/build-binary-callable.yml
    with:
      publish: ${{ inputs.publish-testpypi }}
      candidate-version: ${{ inputs.candidate-version }}
      repository-url: https://test.pypi.org/legacy/
    secrets:
      upload-token: ${{ secrets.TEST_PYPI_TOKEN }}

  downloaded-pair:
    needs: linux-release
    if: ${{ inputs.publish-testpypi }}
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    strategy:
      fail-fast: false
      matrix:
        pythonpath: [cp311-cp311, cp312-cp312, cp313-cp313, cp314-cp314]
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact TestPyPI wheels and validate the public extra
        run: |
          set -euo pipefail
          export PATH=/opt/python/${{ matrix.pythonpath }}/bin:$PATH
          pip install --upgrade pip wheel
          pip download --index-url https://test.pypi.org/simple/ --no-deps --only-binary=:all: --dest downloaded "mfem==$CANDIDATE_VERSION" "mfem-mpich==$CANDIDATE_VERSION"
          python _build_system/distribution/validate_mpich_pair.py downloaded/mfem-*.whl downloaded/mfem_mpich-*.whl --work-dir "$RUNNER_TEMP/downloaded-validation" --examples-dir examples --mesh data/star.mesh 2>&1 | tee downloaded-validation.log
      - name: Save downloaded-pair validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-mpich-logs-${{ matrix.pythonpath }}
          path: downloaded-validation.log
          if-no-files-found: ignore
